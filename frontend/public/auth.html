        <div id="auth-forms-wrap">

            <a href="#" id="tab-login" class="active">Login</a>
            <a href="#" id="tab-register">Register</a>
        </div>

        <div id="panel-login" class="panel active">

                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="you@example.com">

        </div>

        <div id="panel-register" class="panel">
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" required placeholder="username">
                </div>
                <div class="form-group">
                    <label for="reg-password">Password (min 8)</label>
                    <input type="password" id="reg-password" required minlength="8">
                </div>
                <div class="form-group">
                    <label for="reg-display">Display name (optional)</label>
                    <input type="text" id="reg-display" placeholder="Display name">

                <button type="submit">Register</button>
            </form>

    <script>
        (function () {
            var token = localStorage.getItem('authToken');
            var navLoginWrap = document.getElementById('nav-login-wrap');
            var navUserWrap = document.getElementById('nav-user-wrap');
            var navUserName = document.getElementById('nav-user-name');
            var navSignOut = document.getElementById('nav-signout');
            var authFormsWrap = document.getElementById('auth-forms-wrap');
            var authLoggedInMsg = document.getElementById('auth-logged-in-msg');

            function setNavLoggedIn(displayName) {
                if (navLoginWrap) navLoginWrap.style.display = 'none';
                if (navUserWrap) navUserWrap.style.display = 'inline';
                if (navUserName) navUserName.textContent = displayName || 'You';
            }
            function setNavLoggedOut() {
                if (navUserWrap) navUserWrap.style.display = 'none';
                if (navLoginWrap) navLoginWrap.style.display = 'inline';
            }
            navSignOut.addEventListener('click', function (e) {
                e.preventDefault();
                localStorage.removeItem('authToken');
                setNavLoggedOut();
                if (authFormsWrap) authFormsWrap.style.display = 'block';
                if (authLoggedInMsg) authLoggedInMsg.style.display = 'none';
            });

            function checkAuth() {
                var modWrap = document.getElementById('nav-mod-wrap');
                if (!token) {
                    setNavLoggedOut();
                    if (modWrap) modWrap.style.display = 'none';
                    if (document.getElementById('nav-admin-wrap')) document.getElementById('nav-admin-wrap').style.display = 'none';
                    return;
                }
                fetch('/api/auth/me/', { headers: { 'Authorization': 'Token ' + token } })
                    .then(function (r) {
                        if (r.ok) return r.json();
                        setNavLoggedOut();
                        return null;
                    })
                    .then(function (data) {
                        if (data) {
                            var name = (data.display_name && data.display_name.trim()) ? data.display_name.trim() : (data.username || '');
                            setNavLoggedIn(name);
                            if (modWrap) modWrap.style.display = data.is_staff ? 'inline' : 'none';
                            var adminWrap = document.getElementById('nav-admin-wrap');
                            if (adminWrap) adminWrap.style.display = data.is_superuser ? 'inline' : 'none';
                            if (authFormsWrap) authFormsWrap.style.display = 'none';
                            if (authLoggedInMsg) {
                                authLoggedInMsg.textContent = 'You\'re logged in as ' + name + '.';
                                authLoggedInMsg.className = 'msg success';
                                authLoggedInMsg.style.display = 'block';
                            }
                        } else {
                            if (modWrap) modWrap.style.display = 'none';
                            if (document.getElementById('nav-admin-wrap')) document.getElementById('nav-admin-wrap').style.display = 'none';
                        }
                    })
                    .catch(function () {
                        setNavLoggedOut();
                        if (document.getElementById('nav-mod-wrap')) document.getElementById('nav-mod-wrap').style.display = 'none';
                        if (document.getElementById('nav-admin-wrap')) document.getElementById('nav-admin-wrap').style.display = 'none';
                    });
            }
            checkAuth();

            var tabLogin = document.getElementById('tab-login');
            var tabRegister = document.getElementById('tab-register');
            var panelLogin = document.getElementById('panel-login');
            var panelRegister = document.getElementById('panel-register');

            tabLogin.onclick = function (e) {
                e.preventDefault();
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                panelLogin.classList.add('active');
                panelRegister.classList.remove('active');
            };
            tabRegister.onclick = function (e) {
                e.preventDefault();
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                panelRegister.classList.add('active');
                panelLogin.classList.remove('active');
            };

            function showMsg(el, text, isError) {
                el.textContent = text;
                el.className = 'msg ' + (isError ? 'error' : 'success');
                el.style.display = 'block';
            }

            document.getElementById('login-form').onsubmit = function (e) {
                e.preventDefault();
                var msgEl = document.getElementById('login-msg');
                var email = document.getElementById('login-email').value.trim();
                var password = document.getElementById('login-password').value;
                fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                })
                    .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
                    .then(function (result) {
                        if (result.ok) {
                            if (result.data.token) localStorage.setItem('authToken', result.data.token);
                            var u = result.data.user || {};
                            var name = (u.display_name && u.display_name.trim()) ? u.display_name.trim() : (u.username || email);
                            showMsg(msgEl, 'Logged in as ' + name + '.', false);
                            setTimeout(function () { window.location.reload(); }, 800);
                        } else {
                            showMsg(msgEl, result.data.detail || result.data.email || result.data.password || 'Login failed', true);
                        }
                    })
                    .catch(function () { showMsg(msgEl, 'Network error', true); });
            };

            document.getElementById('register-form').onsubmit = function (e) {
                e.preventDefault();
                var msgEl = document.getElementById('register-msg');
                var payload = {
                    email: document.getElementById('reg-email').value.trim(),
                    username: document.getElementById('reg-username').value.trim(),
                    password: document.getElementById('reg-password').value,
                    display_name: document.getElementById('reg-display').value.trim() || ''
                };
                fetch('/api/auth/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                    .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
                    .then(function (result) {
                        if (result.ok) {
                            if (result.data.token) localStorage.setItem('authToken', result.data.token);
                            var u = result.data.user || {};
                            var name = (u.display_name && u.display_name.trim()) ? u.display_name.trim() : (u.username || payload.username);
                            showMsg(msgEl, 'Registered as ' + name + '.', false);
                            setTimeout(function () { window.location.reload(); }, 800);
                        } else {
                            var err = result.data.email || result.data.username || result.data.password || result.data.detail || JSON.stringify(result.data);
                            showMsg(msgEl, typeof err === 'string' ? err : err[0] || 'Registration failed', true);
                        }
                    })
                    .catch(function () { showMsg(msgEl, 'Network error', true); });
            };
        })();
    </script>
</body>
