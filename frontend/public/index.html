<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Project</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .home-page { max-width: 900px; margin: 0 auto; padding: 20px; }
        .home-page .hero { border-radius: 8px; padding: 48px 32px; margin-bottom: 24px; }
        .home-page main { margin: 0; }
    </style>
</head>
<body>
    <header>
        <h1>Pet Project</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/pets/">Pets</a>
            <a href="/pets/create/">Create a pet</a>
            <span id="nav-mod-wrap" style="display: none;"><a href="/mod/">Mod</a></span>
            <span id="nav-admin-wrap" style="display: none;"><a href="/manage/">Admin</a></span>
            <span id="nav-login-wrap"><a href="/auth/">Login / Register</a></span>
            <span id="nav-user-wrap" style="display: none;"><span id="nav-user-name"></span> <a href="#" id="nav-signout">Sign out</a></span>
        </nav>
    </header>

    <div class="home-page">
        <section class="hero">
            <h2>What is it?</h2>
            <p>Take a picture, turn it into your own digital interactive pet!</p>
        </section>

        <main>
            <h2>Welcome</h2>
            <p>Create an account, then head to <a href="/pets/">Pets</a> to see and manage your virtual pets.</p>
        </main>
    </div>
<script>
(function () {
    var token = localStorage.getItem('authToken');
    var loginWrap = document.getElementById('nav-login-wrap');
    var userWrap = document.getElementById('nav-user-wrap');
    var userName = document.getElementById('nav-user-name');
    var signOut = document.getElementById('nav-signout');

    function setLoggedIn(displayName) {
        if (loginWrap) loginWrap.style.display = 'none';
        if (userWrap) userWrap.style.display = 'inline';
        if (userName) userName.textContent = displayName || 'You';
    }
    function setLoggedOut() {
        if (userWrap) userWrap.style.display = 'none';
        if (loginWrap) loginWrap.style.display = 'inline';
    }

    signOut.addEventListener('click', function (e) {
        e.preventDefault();
        localStorage.removeItem('authToken');
        setLoggedOut();
    });

    if (!token) {
        setLoggedOut();
        var m = document.getElementById('nav-mod-wrap');
        if (m) m.style.display = 'none';
        var a = document.getElementById('nav-admin-wrap');
        if (a) a.style.display = 'none';
        return;
    }
    fetch('/api/auth/me/', {
        headers: { 'Authorization': 'Token ' + token }
    })
        .then(function (r) {
            if (r.ok) return r.json();
            setLoggedOut();
            return null;
        })
        .then(function (data) {
            if (data) {
                var name = (data.display_name && data.display_name.trim()) ? data.display_name.trim() : (data.username || '');
                setLoggedIn(name);
                var modWrap = document.getElementById('nav-mod-wrap');
                if (modWrap) modWrap.style.display = data.is_staff ? 'inline' : 'none';
                var adminWrap = document.getElementById('nav-admin-wrap');
                if (adminWrap) adminWrap.style.display = data.is_superuser ? 'inline' : 'none';
            } else {
                var modWrap = document.getElementById('nav-mod-wrap');
                if (modWrap) modWrap.style.display = 'none';
            }
        })
        .catch(function () { setLoggedOut(); var m = document.getElementById('nav-mod-wrap'); if (m) m.style.display = 'none'; var a = document.getElementById('nav-admin-wrap'); if (a) a.style.display = 'none'; });
})();
</script>
</body>
</html>
